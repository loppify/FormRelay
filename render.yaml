services:
  - type: web
    name: ackvia
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: formrelay-db
          property: connectionString

databases:
  - name: formrelay-db
    plan: free
    databaseName: formrelay
    user: postgres